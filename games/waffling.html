<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waffling - Speed Charades</title>
</head>
<body>

  <header id="page-header">
    <h1>waffling</h1>
    <p><a href="../index.html">&larr; Back to Home</a></p>
    <hr>
  </header>

  <main>
    <!-- STEP 1: SETUP FORM -->
    <section id="setup-screen">
      <h2>Game Setup</h2>
      <form id="setup-form">
        
        <!-- Category Select -->
        <div>
          <label for="category-select"><strong>Category:</strong></label>
          <select id="category-select" required>
            <!-- Populated dynamically from AVAILABLE_CATEGORIES array -->
          </select>
        </div>

        <br>

        <!-- Time Limit Input -->
        <div>
          <label for="time-limit"><strong>Time Limit (Seconds):</strong></label>
          <input type="number" id="time-limit" min="5" value="60" required>
        </div>

        <br>

        <button type="submit" id="start-btn" disabled>Loading Data...</button>
      </form>
    </section>

    <!-- STEP 2 & 3: GAME CONTAINER (Used for both Countdown and Active Gameplay) -->
    <section id="game-screen" style="display: none; height: 100vh; box-sizing: border-box; overflow: hidden;">
      <!-- Active Game Header Info -->
      <div id="game-hud" style="display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; padding: 10px 0;">
        <div>Time Remaining: <span id="game-timer">60</span>s</div>
        <div>Score: <span id="game-score">0</span></div>
      </div>

      <!-- Split Touch Screen Controls with Central Overlay -->
      <div style="position: relative; width: 100%; height: calc(100vh - 55px); margin: 0;">
        
        <!-- Interactive Color Buttons Container -->
        <div style="display: flex; width: 100%; height: 100%;">
          <!-- Pass Button (Left Half - Red) -->
          <button id="pass-btn" type="button" aria-label="Pass" style="width: 50%; height: 100%; background-color: #e74c3c; border: none; cursor: pointer;" disabled></button>
          
          <!-- Correct Button (Right Half - Green) -->
          <button id="correct-btn" type="button" aria-label="Correct" style="width: 50%; height: 100%; background-color: #2ecc71; border: none; cursor: pointer;" disabled></button>
        </div>

        <!-- Center Overlay (Used for both Countdown prompt and active words) -->
        <div id="word-overlay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: bold; color: #000; text-shadow: 0 0 6px #fff, 0 0 6px #fff; pointer-events: none; text-align: center; width: 90%; word-wrap: break-word;">
          ---
        </div>

      </div>
    </section>

    <!-- STEP 4: GAME OVER SCREEN -->
    <section id="gameover-screen" style="display: none; text-align: center;">
      <h2>Time's Up!</h2>
      <p>Final Score:</p>
      <h1 id="final-score" style="font-size: 60px;">0</h1>

      <br>
      <button type="button" onclick="window.location.reload()">Play Again</button>
    </section>
  </main>

  <script>
    // --- CATEGORIES CONFIGURATION ---
    const AVAILABLE_CATEGORIES = [
      { key: "nba", name: "NBA Players" },
      { key: "movies", name: "Movies" },
      { key: "pokemon", name: "Pokemon" },
      { key: "countries", name: "Countries" }
    ];

    // --- GLOBAL DATA & GAME STATE ---
    let currentCategoryData = null;
    let wordDeck = [];
    let currentWordIndex = 0;

    let gameState = {
      score: 0,
      timeRemaining: 60,
      timerInterval: null
    };

    // --- DOM ELEMENTS ---
    const pageHeader = document.getElementById("page-header");
    const categorySelect = document.getElementById("category-select");
    const timeLimitInput = document.getElementById("time-limit");
    const setupForm = document.getElementById("setup-form");
    const startBtn = document.getElementById("start-btn");

    const setupScreen = document.getElementById("setup-screen");
    const gameScreen = document.getElementById("game-screen");
    const gameTimer = document.getElementById("game-timer");
    const gameScore = document.getElementById("game-score");
    const wordOverlay = document.getElementById("word-overlay");
    const passBtn = document.getElementById("pass-btn");
    const correctBtn = document.getElementById("correct-btn");

    const gameoverScreen = document.getElementById("gameover-screen");
    const finalScore = document.getElementById("final-score");

    // --- POPULATE CATEGORY DROPDOWN ---
    function populateCategoryDropdown() {
      categorySelect.innerHTML = "";
      AVAILABLE_CATEGORIES.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat.key;
        option.innerText = cat.name;
        categorySelect.appendChild(option);
      });
    }

    // --- FETCH SPECIFIC CATEGORY JSON ---
    async function loadCategoryData(categoryKey) {
      startBtn.disabled = true;
      startBtn.innerText = "Loading Category...";

      try {
        const response = await fetch(`../data/${categoryKey}.json`);
        if (!response.ok) throw new Error(`Failed to load ${categoryKey}.json`);
        
        currentCategoryData = await response.json();

        startBtn.innerText = "Start Game";
        startBtn.disabled = false;
      } catch (error) {
        console.error(error);
        alert(`Error loading data for "${categoryKey}"! Make sure ../data/${categoryKey}.json exists.`);
      }
    }

    // --- EVENT LISTENERS ---
    categorySelect.addEventListener("change", (e) => {
      loadCategoryData(e.target.value);
    });

    setupForm.addEventListener("submit", (e) => {
      e.preventDefault();

      if (!currentCategoryData || !currentCategoryData.items.length) {
        alert("Selected category data is missing or empty!");
        return;
      }

      gameState.timeRemaining = parseInt(timeLimitInput.value, 10) || 60;
      
      // Shuffle names from category items into wordDeck
      wordDeck = currentCategoryData.items.map(item => item.name);
      wordDeck.sort(() => Math.random() - 0.5);
      currentWordIndex = 0;

      // Hide Setup & Header, Show Game Layout immediately
      setupScreen.style.display = "none";
      pageHeader.style.display = "none";
      gameScreen.style.display = "block";

      startGetReadyCountdown();
    });

    // --- COUNTDOWN (5 SECONDS) ---
    function startGetReadyCountdown() {
      let count = 5;
      
      // Disable buttons during countdown
      passBtn.disabled = true;
      correctBtn.disabled = true;

      gameTimer.innerText = gameState.timeRemaining;
      gameScore.innerText = 0;
      wordOverlay.innerHTML = `<div style="font-size: 20px;">Place phone on forehead!</div><div style="font-size: 70px; margin-top: 10px;">${count}</div>`;

      const countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          wordOverlay.innerHTML = `<div style="font-size: 20px;">Place phone on forehead!</div><div style="font-size: 70px; margin-top: 10px;">${count}</div>`;
        } else {
          clearInterval(countdownInterval);
          startGame();
        }
      }, 1000);
    }

    // --- START GAME LOOP & TIMER ---
    function startGame() {
      gameState.score = 0;
      gameScore.innerText = gameState.score;
      gameTimer.innerText = gameState.timeRemaining;

      // Enable interactive buttons
      passBtn.disabled = false;
      correctBtn.disabled = false;

      displayNextWord();

      gameState.timerInterval = setInterval(() => {
        gameState.timeRemaining--;
        gameTimer.innerText = gameState.timeRemaining;

        if (gameState.timeRemaining <= 0) {
          endGame();
        }
      }, 1000);
    }

    // --- GAME ACTIONS ---
    function displayNextWord() {
      if (currentWordIndex >= wordDeck.length) {
        // Reshuffle deck if all words were cycled through
        wordDeck.sort(() => Math.random() - 0.5);
        currentWordIndex = 0;
      }

      wordOverlay.innerText = wordDeck[currentWordIndex];
    }

    passBtn.addEventListener("click", () => {
      if (passBtn.disabled) return;
      currentWordIndex++;
      displayNextWord();
    });

    correctBtn.addEventListener("click", () => {
      if (correctBtn.disabled) return;
      gameState.score++;
      gameScore.innerText = gameState.score;
      currentWordIndex++;
      displayNextWord();
    });

    // --- END GAME ---
    function endGame() {
      clearInterval(gameState.timerInterval);
      gameScreen.style.display = "none";
      
      // Restore header on game over screen
      pageHeader.style.display = "block";
      
      gameoverScreen.style.display = "block";
      finalScore.innerText = gameState.score;
    }

    // --- INITIALIZATION ---
    function init() {
      populateCategoryDropdown();
      if (AVAILABLE_CATEGORIES.length > 0) {
        loadCategoryData(AVAILABLE_CATEGORIES[0].key);
      }
    }

    init();
  </script>

</body>
</html>
